<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- interactive-widget : sans lui, l'ouverture du clavier Android pousse la page
     vers le haut et fait disparaître l'en-tête et la conversation. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B6E4F">
<title>Répétiteur Maths — BEPC</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg">
<link rel="apple-touch-icon" href="icone.svg">
<style>
  :root{--vert:#0B6E4F;--vert-clair:#E6F2EE;--jaune:#FCD116;--fond:#F7F6F3;--texte:#17211D;--gris:#6B7671}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);
       color:var(--texte);height:var(--hauteur, 100dvh);display:flex;flex-direction:column;
       overscroll-behavior:none;position:fixed;top:0;left:0;right:0}

  /* ---- Écran d'accueil : on demande juste le prénom ---- */
  /* overflow-y : avec le clavier ouvert, l'écran d'accueil doit rester
     parcourable au lieu de tronquer le bouton « Commencer ». */
  #accueil{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
           padding:28px;text-align:center;gap:14px;overflow-y:auto}
  #accueil .logo{font-size:56px;line-height:1}
  #accueil h1{font-size:24px;font-weight:800}
  #accueil p{color:var(--gris);font-size:15px;max-width:300px;line-height:1.5}
  #accueil input{width:100%;max-width:300px;padding:15px;border:2px solid #DDD8D0;border-radius:14px;
                 font-size:17px;background:#fff;text-align:center}
  #accueil input:focus{outline:none;border-color:var(--vert)}
  .btn{background:var(--vert);color:#fff;border:none;border-radius:14px;padding:15px 28px;
       font-size:17px;font-weight:600;cursor:pointer;width:100%;max-width:300px}
  .btn:disabled{opacity:.5}
  #accueil-erreur{background:#FDECEC;color:#9B2C2C;border-radius:12px;padding:13px 15px;
                  font-size:14.5px;line-height:1.45;max-width:300px;text-align:left}
  #version{font-size:11.5px;color:var(--gris);opacity:.65;margin-top:2px}
  .lien{background:none;border:none;color:var(--gris);font-size:13.5px;
        text-decoration:underline;cursor:pointer;font-family:inherit;padding:2px}

  /* Choix du niveau : BEPC ou BAC */
  /* Empilés : trois choix ne tiennent pas côte à côte sur un téléphone. */
  .niveaux{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
  .niveau{background:#fff;border:2px solid #DDD8D0;border-radius:14px;padding:12px 15px;
          font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--texte);
          display:flex;flex-direction:row;justify-content:space-between;align-items:center;
          gap:8px;line-height:1.2}
  .niveau span{font-size:11.5px;font-weight:400;color:var(--gris)}
  .niveau.actif{border-color:var(--vert);background:var(--vert-clair);color:var(--vert)}
  .niveau.actif span{color:var(--vert)}

  /* Élèves déjà enregistrés sur ce téléphone (plusieurs personnes le partagent) */
  #deja-inscrits{width:100%;max-width:300px;margin-top:4px}
  #deja-inscrits .titre{font-size:12.5px;color:var(--gris);margin:10px 0 7px;text-align:left}
  .profil{display:flex;justify-content:space-between;align-items:center;width:100%;
          background:#fff;border:1px solid #DDD8D0;border-radius:12px;padding:12px 14px;
          margin-bottom:7px;font-size:16px;font-weight:600;cursor:pointer;
          font-family:inherit;color:var(--texte);text-align:left}
  .profil small{font-weight:400;font-size:12px;color:var(--gris)}
  .profil.distant{border-color:var(--vert);background:var(--vert-clair);color:var(--vert)}
  .profil.distant small{color:var(--vert);opacity:.8}
  .profil .fleche{color:inherit;opacity:.6}
  .profil .suppr{background:none;border:none;color:var(--gris);font-size:17px;
                 cursor:pointer;padding:0 0 0 10px}

  /* ---- En-tête ---- */
  header{background:var(--vert);color:#fff;padding:calc(env(safe-area-inset-top) + 13px) 16px 13px;
         display:flex;align-items:center;gap:10px;flex-shrink:0}
  header .t{font-weight:700;font-size:16px}
  header .s{font-size:12px;opacity:.85}
  header button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:50%;
                width:36px;height:36px;font-size:22px;line-height:1;cursor:pointer;flex-shrink:0}

  /* ---- Conversation ---- */
  #fil{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;
       -webkit-overflow-scrolling:touch}
  .msg{max-width:86%;padding:12px 15px;border-radius:18px;font-size:16px;line-height:1.5;
       white-space:pre-wrap;word-wrap:break-word;animation:apparait .2s ease}
  @keyframes apparait{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eleve{align-self:flex-end;background:var(--vert);color:#fff;border-bottom-right-radius:5px}
  .tuteur{align-self:flex-start;background:#fff;border:1px solid #E8E4DE;border-bottom-left-radius:5px}
  .erreur{align-self:center;background:#FDECEC;color:#9B2C2C;font-size:14px;border-radius:12px}
  .msg img{max-width:100%;border-radius:12px;margin-bottom:8px;display:block}
  .points span{display:inline-block;width:7px;height:7px;margin:0 2px;background:var(--gris);
               border-radius:50%;animation:saute 1.2s infinite}
  .points span:nth-child(2){animation-delay:.2s}.points span:nth-child(3){animation-delay:.4s}
  @keyframes saute{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* ---- Symboles mathématiques ---- */
  /* Défilement horizontal : sur un écran étroit, mieux vaut faire glisser
     la rangée que rétrécir des touches déjà petites pour un doigt. */
  #symboles{flex-shrink:0;display:flex;gap:6px;padding:8px 12px 0;
            overflow-x:auto;background:#fff;-webkit-overflow-scrolling:touch}
  #symboles::-webkit-scrollbar{display:none}
  #symboles button{flex-shrink:0;min-width:42px;height:38px;border:1px solid #E8E4DE;
                   background:var(--fond);border-radius:10px;font-size:17px;
                   color:var(--texte);cursor:pointer;font-family:inherit}
  #symboles button:active{background:var(--vert-clair);border-color:var(--vert)}

  /* ---- Barre de saisie ---- */
  #barre{flex-shrink:0;background:#fff;border-top:1px solid #E8E4DE;padding:10px 12px;
         padding-bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;align-items:flex-end}
  #texte{flex:1;border:1px solid #DDD8D0;border-radius:20px;padding:11px 15px;font-size:16px;
         resize:none;max-height:110px;font-family:inherit;line-height:1.4}
  #texte:focus{outline:none;border-color:var(--vert)}
  .rond{width:44px;height:44px;border-radius:50%;border:none;font-size:20px;cursor:pointer;
        flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #photo-btn{background:var(--vert-clair)}
  #envoyer{background:var(--vert);color:#fff}
  #envoyer:disabled{opacity:.4}
  #apercu{position:relative;padding:0 12px 8px;background:#fff}
  #apercu img{height:64px;border-radius:10px;border:2px solid var(--vert)}
  #apercu button{position:absolute;top:-4px;left:64px;background:#17211D;color:#fff;border:none;
                 border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px}
  /* ---- Mes discussions ---- */
  #seances{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px}
  #seances .titre{font-size:13px;text-transform:uppercase;letter-spacing:.5px;
                  color:var(--gris);margin-bottom:3px}
  .seance{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
          background:#fff;border:1px solid #E8E4DE;border-radius:14px;padding:13px 15px;
          font-size:15.5px;cursor:pointer;font-family:inherit;color:var(--texte);text-align:left}
  .seance.actuelle{border-color:var(--vert);background:var(--vert-clair)}
  .seance b{font-weight:600;display:block}
  .seance small{color:var(--gris);font-size:12.5px;font-weight:400}
  .seance .fleche{color:var(--gris);flex-shrink:0}
  #seances .patience{text-align:center;color:var(--gris);padding:30px 12px;font-size:15px}
  #seances .btn{margin-top:auto;max-width:none}

  /* ---- Ma progression ---- */
  #progres{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  #progres .bloc{background:#fff;border:1px solid #E8E4DE;border-radius:16px;padding:16px}
  #progres .bloc h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;
                    color:var(--gris);margin-bottom:9px}
  #progres .resume{font-size:16.5px;line-height:1.5}
  #progres .compteurs{display:flex;gap:10px}
  #progres .compteur{flex:1;background:#fff;border:1px solid #E8E4DE;border-radius:14px;
                     padding:13px 8px;text-align:center}
  #progres .compteur b{display:block;font-size:23px;color:var(--vert)}
  #progres .compteur span{font-size:11.5px;color:var(--gris)}
  #progres .chap{display:flex;align-items:flex-start;gap:11px;padding:10px 0;
                 border-bottom:1px solid #EFEBE5}
  #progres .chap:last-child{border-bottom:none}
  #progres .pastille{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:6px}
  #progres .acquis{background:var(--vert)}
  #progres .encours{background:#D68910}
  #progres .difficulte{background:#C0392B}
  #progres .chap-nom{font-weight:600}
  #progres .chap-info{font-size:13.5px;color:var(--gris)}
  #progres .etape{background:var(--vert-clair);border:1px solid var(--vert);
                  border-radius:16px;padding:16px;font-size:16px;line-height:1.5;color:var(--vert)}
  #progres .patience{text-align:center;color:var(--gris);padding:30px 12px;font-size:15px}
  #progres .btn{margin-top:auto;max-width:none}
  .cache{display:none !important}
</style>
</head>
<body>

<div id="accueil">
  <div class="logo">📐</div>
  <h1>Répétiteur Maths</h1>
  <p id="promesse">Bloqué sur un exercice ? Envoie-le-moi.<br>On le résout ensemble, et tu sauras le refaire seul le jour du BEPC.</p>
  <input id="code" class="cache" placeholder="Code d'accès" autocomplete="off">
  <input id="prenom" placeholder="Ton prénom" autocomplete="given-name">
  <div class="niveaux">
    <button class="niveau actif" data-niveau="bepc">10ᵉ année<span>BEPC · Maths</span></button>
    <button class="niveau" data-niveau="bepc-physique">10ᵉ année<span>BEPC · Physique</span></button>
    <button class="niveau" data-niveau="bac">Terminale<span>BAC · Maths</span></button>
  </div>
  <button class="btn" id="commencer" disabled>Commencer</button>
  <button id="changer-code" class="lien cache">Ce n'est pas mon code d'accès</button>
  <div id="accueil-erreur" class="cache"></div>
  <div id="version">version 27</div>
  <div id="deja-inscrits"></div>
</div>

<header class="cache" id="entete">
  <div style="font-size:22px">📐</div>
  <div style="flex:1"><div class="t">Répétiteur Maths</div><div class="s" id="salut"></div></div>
  <button id="seances-btn" title="Mes discussions">☰</button>
  <button id="progres-btn" title="Ma progression">📈</button>
  <button id="changer" title="Changer d'élève">👤</button>
  <button id="nouveau" title="Nouvel exercice">＋</button>
</header>

<div id="fil" class="cache"></div>

<!-- Les discussions de l'élève : son cours reste là pendant qu'il vérifie
     autre chose à côté. -->
<div id="seances" class="cache">
  <div id="seances-liste"></div>
  <button class="btn" id="fermer-seances">Retour</button>
</div>

<!-- Ce que l'élève voit de son propre travail : sa raison de revenir. -->
<div id="progres" class="cache">
  <div id="progres-contenu"></div>
  <button class="btn" id="fermer-progres">Retour à mon exercice</button>
</div>

<div id="apercu" class="cache"><img id="apercu-img"><button id="retirer">✕</button></div>

<div id="symboles" class="cache">
  <button data-symbole="√">√</button>
  <button data-symbole="²">x²</button>
  <button data-symbole="³">x³</button>
  <button data-symbole="/">/</button>
  <button data-symbole="×">×</button>
  <button data-symbole="π">π</button>
  <button data-symbole="≤">≤</button>
  <button data-symbole="≥">≥</button>
  <button data-symbole="°">°</button>
</div>

<div id="barre" class="cache">
  <input type="file" id="fichier" accept="image/*" capture="environment" hidden>
  <button class="rond" id="photo-btn" title="Photographier l'exercice">📷</button>
  <textarea id="texte" rows="1" placeholder="Écris ta question…"></textarea>
  <button class="rond" id="envoyer" disabled>➤</button>
</div>

<script>
const API = location.origin;
const MAX_MESSAGES = 40;  // au-delà, c'est un autre exercice : on allège
let eleve = '';           // prénom de l'élève actif
let niveau = 'bepc';      // « bepc » (10e année) ou « bac » (Terminale)
let historique = [];      // conversation envoyée à l'IA
let photo = null;         // {data, type} de la photo en attente
let occupe = false;
let codeAcces = localStorage.getItem('code_acces') || '';
// Séance de travail en cours. L'élève peut en ouvrir une deuxième pour une
// question rapide, puis revenir à son cours : chacune garde son fil.
let seanceActive = null;
// Les niveaux que l'application sait ouvrir.
const LIBELLES_CONNUS = ['bepc', 'bepc-physique', 'bac'];
// Vrai dès que l'élève a lui-même touché un bouton de niveau.
let niveauChoisiALaMain = false;

const $ = id => document.getElementById(id);

/* Le code d'accès accompagne chaque appel au serveur, photos comprises. */
const parametres = (extra = {}) => {
  const p = new URLSearchParams();
  if (codeAcces) p.set('code', codeAcces);
  Object.entries(extra).forEach(([c, v]) => { if (v != null) p.set(c, v); });
  return p.toString();
};
const urlServeur = chemin =>
  chemin ? API + chemin + (codeAcces ? '?' + parametres() : '') : null;

/* Clavier Android : sur les navigateurs qui ignorent « interactive-widget »,
   on mesure nous-mêmes la hauteur réellement visible. Sans ça, l'en-tête et
   la conversation glissent hors de l'écran dès que le clavier s'ouvre. */
if (window.visualViewport) {
  const ajusterHauteur = () => {
    document.body.style.setProperty('--hauteur', window.visualViewport.height + 'px');
    // Le dernier message doit rester visible au-dessus du clavier.
    if (!$('fil').classList.contains('cache')) $('fil').scrollTop = $('fil').scrollHeight;
  };
  window.visualViewport.addEventListener('resize', ajusterHauteur);
  ajusterHauteur();
}

/* Le code d'accès protège la clé API : sans lui, n'importe quel visiteur
   du site pourrait poser des questions aux frais du propriétaire. */
fetch('/api/config').then(r => r.json()).then(c => {
  if (!c.code_requis) return;
  if (!codeAcces) {
    $('code').classList.remove('cache');
    $('code').addEventListener('input', majDemarrage);
    majDemarrage();
  } else {
    // Ordinateur partagé : le code enregistré est peut-être celui d'un autre.
    $('changer-code').classList.remove('cache');
  }
}).catch(() => {});

$('changer-code').addEventListener('click', () => {
  if (!confirm("Saisir un autre code d'accès ?\n\n" +
               "Les élèves déjà enregistrés sur cet appareil resteront disponibles.")) return;
  localStorage.removeItem('code_acces');
  location.reload();
});

function majDemarrage() {
  const codeOk = $('code').classList.contains('cache') || $('code').value.trim().length >= 4;
  $('commencer').disabled = $('prenom').value.trim().length < 2 || !codeOk;
}

/* --- Plusieurs élèves sur un même téléphone ----------------------------
   Ici un téléphone est souvent partagé (frères et sœurs, cousins).
   Chaque élève a donc son propre profil et sa propre conversation, et on
   peut passer de l'un à l'autre sans rien perdre.                      */

const identifiantDe = nom =>
  nom.toLowerCase().trim().replace(/[^a-z0-9 _-]/g, '').replace(/ /g, '_').slice(0, 40);
/* Les maths et la physique sont deux cours séparés : ils ne doivent pas
   partager la même mémoire dans le téléphone, sinon l'élève ouvre la
   physique et retrouve sa discussion de maths à l'écran.
   Les maths gardent la clé d'origine : les élèves déjà installés ne
   perdent pas leur travail. */
const suffixeMatiere = () => (niveau && niveau !== 'bepc') ? '_' + niveau : '';
const cleConversation = () => 'conv_' + identifiantDe(eleve) + suffixeMatiere();
const cleSeance = () => 'seance_' + identifiantDe(eleve) + suffixeMatiere();

function lireProfils() {
  try { return JSON.parse(localStorage.getItem('profils') || '[]'); }
  catch (e) { return []; }
}

function enregistrerProfil(nom, niv) {
  const profils = lireProfils().filter(p => identifiantDe(p.nom) !== identifiantDe(nom));
  profils.unshift({ nom, niveau: niv });
  localStorage.setItem('profils', JSON.stringify(profils.slice(0, 8)));
  localStorage.setItem('profil_actif', JSON.stringify({ nom, niveau: niv }));
}

function supprimerProfil(nom) {
  localStorage.setItem('profils', JSON.stringify(
    lireProfils().filter(p => identifiantDe(p.nom) !== identifiantDe(nom))));
  localStorage.removeItem('conv_' + identifiantDe(nom));
}

/** Retour à l'écran d'accueil pour qu'un autre élève prenne la main. */
function changerEleve() {
  if (occupe) return;
  localStorage.removeItem('profil_actif');
  eleve = ''; historique = [];
  $('fil').innerHTML = '';
  $('prenom').value = '';
  $('commencer').disabled = true;
  seanceActive = null;
  niveau = 'bepc';
  niveauChoisiALaMain = false;
  document.querySelectorAll('.niveau').forEach(x =>
    x.classList.toggle('actif', x.dataset.niveau === niveau));
  majPromesse();
  ['entete', 'fil', 'barre', 'symboles', 'apercu', 'progres', 'seances']
    .forEach(id => $(id).classList.add('cache'));
  $('accueil').classList.remove('cache');
  afficherProfils();
}

/* Le serveur sait qui travaille déjà avec ce code. Sur un appareil neuf, on
   propose ces élèves : sans ça, un prénom retapé autrement — ou le code
   collé par erreur dans la case du prénom — crée un élève de plus, vide. */
async function proposerProfilsDuCode() {
  if (!codeAcces) return;
  const zone = $('deja-inscrits');
  try {
    const r = await fetch(API + '/api/profils?' + parametres());
    if (!r.ok) return;
    const { profils } = await r.json();
    const connusIci = lireProfils().map(p => identifiantDe(p.nom));
    const ailleurs = profils.filter(p => !connusIci.includes(identifiantDe(p.nom)));
    if (!ailleurs.length) return;

    zone.insertAdjacentHTML('afterbegin',
      '<div class="titre">Avec ce code, sur un autre appareil :</div>' +
      ailleurs.map(p => `<div class="profil distant" data-nom="${echapper(p.nom)}"
                              data-niveau="${p.niveau}">
          <span>${echapper(p.nom)} <small>${p.questions} question(s) déjà posée(s)</small></span>
          <span class="fleche">›</span>
        </div>`).join(''));

    zone.querySelectorAll('.profil.distant').forEach(el =>
      el.addEventListener('click', () => {
        $('prenom').value = el.dataset.nom;
        if (!niveauChoisiALaMain)
          niveau = LIBELLES_CONNUS.includes(el.dataset.niveau) ? el.dataset.niveau : 'bepc';
        demarrer();
      }));
  } catch (e) { /* hors ligne : l'élève saisit son prénom comme avant */ }
}

function afficherProfils() {
  const profils = lireProfils();
  const zone = $('deja-inscrits');
  if (!profils.length) { zone.innerHTML = ''; proposerProfilsDuCode(); return; }
  zone.innerHTML = '<div class="titre">Déjà sur ce téléphone :</div>' +
    profils.map(p => `<div class="profil" data-nom="${p.nom.replace(/"/g, '&quot;')}">
        <span>${p.nom} <small>${p.niveau === 'bac' ? 'Terminale' : '10ᵉ année'}</small></span>
        <button class="suppr" title="Retirer">✕</button>
      </div>`).join('');

  zone.querySelectorAll('.profil').forEach(el => {
    const nom = el.dataset.nom;
    el.addEventListener('click', ev => {
      if (ev.target.classList.contains('suppr')) return;
      const p = lireProfils().find(x => x.nom === nom);
      $('prenom').value = p.nom;
      if (!niveauChoisiALaMain) niveau = p.niveau || 'bepc';
      demarrer();
    });
    el.querySelector('.suppr').addEventListener('click', ev => {
      ev.stopPropagation();
      if (confirm('Retirer ' + nom + ' de ce téléphone ? Sa conversation sera effacée.')) {
        supprimerProfil(nom);
        afficherProfils();
      }
    });
  });
  proposerProfilsDuCode();
}

/* --- Mémoire de la conversation ---------------------------------------
   Sans ça, l'élève perd tout son travail dès qu'il actualise, change
   d'application, ou que le téléphone recharge la page.            */

function urlPhotoDe(m) {
  return m.image ? 'data:' + (m.image_type || 'image/jpeg') + ';base64,' + m.image : null;
}

function sauvegarder() {
  // On ne garde que la dernière photo : les images sont lourdes et
  // rempliraient la mémoire du navigateur au bout de quelques exercices.
  let derniereVue = false;
  const aGarder = historique.slice(-MAX_MESSAGES).slice().reverse().map(m => {
    if (!m.image) return m;
    if (!derniereVue) { derniereVue = true; return m; }
    return { role: m.role, content: m.content + ' [photo]' };
  }).reverse();

  try {
    localStorage.setItem(cleConversation(), JSON.stringify(aGarder));
  } catch (e) {
    // Mémoire pleine : on repart sur les échanges récents, sans photo.
    try {
      localStorage.setItem(cleConversation(), JSON.stringify(
        historique.slice(-12).map(m => ({ role: m.role, content: m.content }))
      ));
    } catch (_) { /* on continue quand même : la conversation reste à l'écran */ }
  }
}

function restaurer() {
  try {
    const brut = localStorage.getItem(cleConversation());
    if (!brut) return false;
    historique = JSON.parse(brut);
    if (!Array.isArray(historique) || !historique.length) { historique = []; return false; }
    historique.forEach(m => {
      afficher(m.role === 'user' ? 'eleve' : 'tuteur', m.content, urlPhotoDe(m));
    });
    return true;
  } catch (e) {
    historique = [];
    return false;
  }
}

/* Ouvre une discussion de plus. Rien n'est effacé : le cours en cours reste
   dans la liste ☰, l'élève y revient quand il veut. */
async function nouvelExercice() {
  if (occupe) return;
  try {
    const r = await fetch(API + '/api/nouvelle-seance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ eleve, code: codeAcces || null }),
    });
    if (!r.ok) throw new Error('serveur');
    seanceActive = (await r.json()).seance;
  } catch (e) {
    // Hors ligne : on avance quand même d'une séance, le serveur suivra.
    seanceActive = (seanceActive || 1) + 1;
  }
  memoriserSeance();
  historique = [];
  localStorage.removeItem(cleConversation());
  fermerPanneaux();
  $('fil').innerHTML = '';
  afficher('tuteur', 'Nouvelle discussion. Qu\'est-ce que tu veux vérifier ?\n\n' +
                     'Ton cours précédent t\'attend dans le bouton ☰.');
  $('texte').focus();
}

async function demarrer() {
  if (!$('code').classList.contains('cache')) {
    codeAcces = $('code').value.trim();
    localStorage.setItem('code_acces', codeAcces);
  }
  eleve = $('prenom').value.trim();
  // Erreur fréquente sur un deuxième appareil : recopier le code d'accès
  // dans la case du prénom. Ça fabrique un élève sans aucun historique.
  if (codeAcces && identifiantDe(eleve) === identifiantDe(codeAcces)) {
    alert("Ça, c'est ton code d'accès.\n\n" +
          "Écris ici ton prénom — le même que sur ton téléphone.");
    $('prenom').value = ''; $('commencer').disabled = true; $('prenom').focus();
    return;
  }

  // Le serveur décide qui a le droit d'entrer : un abonnement ne porte qu'un
  // nombre limité d'élèves. On refuse ici plutôt qu'à la première question.
  $('accueil-erreur').classList.add('cache');
  $('commencer').disabled = true;
  $('commencer').textContent = 'Un instant…';
  try {
    const r = await fetch(API + '/api/verifier-eleve?' + parametres({ eleve, niveau }));
    if (r.status === 402 || r.status === 409 || r.status === 429) {
      const { detail } = await r.json().catch(() => ({}));
      $('accueil-erreur').textContent = detail || 'Cet abonnement a atteint sa limite.';
      $('accueil-erreur').classList.remove('cache');
      return;
    }
    if (r.status === 403) {
      $('accueil-erreur').textContent = "Ce code d'accès n'est pas reconnu. " +
        'Vérifie-le auprès de la personne qui te l\'a donné.';
      $('accueil-erreur').classList.remove('cache');
      localStorage.removeItem('code_acces');
      return;
    }
  } catch (e) {
    // Hors ligne : on laisse entrer, le serveur tranchera à la première question.
  } finally {
    $('commencer').textContent = 'Commencer';
    $('commencer').disabled = false;
  }

  enregistrerProfil(eleve, niveau);
  ouvrirChat();
}

/* L'élève change d'appareil (téléphone puis ordinateur) : son travail est
   sur le serveur, pas dans le téléphone. On le récupère au démarrage. */
async function reprendreDuServeur(dejaAffiche) {
  const pour = eleve;   // l'élève peut changer pendant la requête
  try {
    const r = await fetch(API + '/api/conversation/' + encodeURIComponent(pour) +
                          '?' + parametres({ seance: seanceActive, niveau }));
    if (!r.ok) return;
    const { messages, seance } = await r.json();
    if (pour !== eleve || occupe) return;
    // Rien de plus que ce qui est déjà à l'écran : on ne touche à rien.
    if (!messages.length || messages.length <= historique.length) return;

    seanceActive = seance;
    memoriserSeance();
    historique = messages.map(m => ({ role: m.role, content: m.content }));
    $('fil').innerHTML = '';
    messages.forEach(m => afficher(m.role === 'user' ? 'eleve' : 'tuteur',
                                   m.content, urlServeur(m.photo)));
    if (!dejaAffiche) {
      afficher('tuteur', 'Je t\'ai retrouvé ton travail. On continue ?');
    }
    sauvegarder();
    $('fil').scrollTop = $('fil').scrollHeight;
  } catch (e) { /* hors ligne : la conversation du téléphone suffit */ }
}

/* Trois choses peuvent échouer ici, et aucune n'était signalée : l'élève
   appuyait, prenait sa photo, et rien ne bougeait à l'écran. */
function echecPhoto(raison) {
  photo = null;
  $('apercu').classList.add('cache');
  majEnvoyer();
  afficher('erreur', raison);
}

$('fichier').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;

  const lecteur = new FileReader();
  lecteur.onerror = () => echecPhoto(
    "Je n'arrive pas à ouvrir cette photo. Reprends-la, ou écris-moi l'exercice.");

  lecteur.onload = ev => {
    const img = new Image();
    // Beaucoup de téléphones Android enregistrent en HEIC, que le navigateur
    // ne sait pas ouvrir. Sans ce garde-fou, l'échec était totalement muet.
    img.onerror = () => echecPhoto(
      "Je n'arrive pas à lire cette photo — ton téléphone l'a peut-être " +
      "enregistrée dans un format que je ne comprends pas.\n\n" +
      "Essaie ceci : dans les réglages de l'appareil photo, choisis le format " +
      "JPEG au lieu de HEIC. Ou écris-moi simplement l'exercice, ça marche aussi bien.");

    img.onload = () => {
      try {
        // On réduit la photo : moins de données consommées, réponse plus rapide.
        const max = 1300;
        const ech = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * ech);
        c.height = Math.round(img.height * ech);
        if (!c.width || !c.height) throw new Error('image vide');
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.82);
        // Un téléphone à court de mémoire rend une image blanche minuscule.
        if (url.length < 2000) throw new Error('image illisible');

        photo = { data: url.split(',')[1], type: 'image/jpeg', url };
        $('apercu-img').src = url;
        $('apercu').classList.remove('cache');
        majEnvoyer();
      } catch (err) {
        echecPhoto("Cette photo est trop lourde pour ton téléphone. " +
                   "Reprends-la d'un peu plus loin, ou écris-moi l'exercice.");
      }
    };
    img.src = ev.target.result;
  };

  lecteur.readAsDataURL(f);
  e.target.value = '';
});

/* ---------- Ma progression ----------------------------------------------
   L'élève ne voit pas le bilan destiné au parent : il voit ses chapitres,
   ce qu'il a réussi, et la seule chose à travailler ensuite. Pour l'élève

$('progres-btn').addEventListener('click', ouvrirProgres);

const echapper = t =>
  String(t ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function fermerProgres() {
  $('progres').classList.add('cache');
  ['fil', 'barre', 'symboles'].forEach(id => $(id).classList.remove('cache'));
}

async function ouvrirProgres() {

  $('progres').classList.remove('cache');

  try {

                          (codeAcces ? '?code=' + encodeURIComponent(codeAcces) : ''));

    }
    afficherProgres(d);
  } catch (e) {

      '<div class="patience">Je n\'arrive pas à charger ta progression maintenant.' +
      '<br>Réessaie dans un moment.</div>';

function afficherProgres(d) {
  const a = d.activite || {};
  const liste = d.chapitres || [];
  const acquis = liste.filter(c => c.niveau === 'acquis').length;

  const chapitres = liste.map(c => {
    const cls = c.niveau === 'acquis' ? 'acquis'
              : c.niveau === 'en cours' ? 'encours' : 'difficulte';
    return `<div class="chap"><div class="pastille ${cls}"></div><div>
        <div class="chap-nom">${echapper(c.nom)}</div>
        <div class="chap-info">${echapper(c.niveau)} — ${echapper(c.commentaire)}</div>
      </div></div>`;
  }).join('');

  $('progres-contenu').innerHTML = `
    <div class="compteurs">
      <div class="compteur"><b>${a.questions ?? 0}</b><span>questions posées</span></div>
      <div class="compteur"><b>${liste.length}</b><span>chapitres travaillés</span></div>
      <div class="compteur"><b>${acquis}</b><span>chapitres acquis</span></div>
    </div>
    <div class="bloc"><h2>Où tu en es</h2>
      <p class="resume">${echapper(d.resume)}</p></div>
    <div class="bloc"><h2>Tes chapitres</h2>
      ${chapitres || '<p style="color:var(--gris)">Aucun chapitre identifié pour l\'instant.</p>'}</div>
    <div class="etape"><b>Ta prochaine étape</b><br>${echapper(d.prochaine_etape)}</div>`;
}

function majEnvoyer() {
  $('envoyer').disabled = occupe || (!zone.value.trim() && !photo);
}

/* Le tuteur écrit **un mot** pour insister : on l'affiche en gras au lieu
   de laisser les astérisques à l'écran. On échappe d'abord le HTML. */
function formater(texte) {
  const sur = texte.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  return sur.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
}

function afficher(qui, texte, urlPhoto) {
  const d = document.createElement('div');
  d.className = 'msg ' + qui;
  if (urlPhoto) { const i = new Image(); i.src = urlPhoto; d.appendChild(i); }
  const t = document.createElement('span');
  t.innerHTML = formater(texte);
  d.appendChild(t);
  d.corps = t;
  $('fil').appendChild(d);
  $('fil').scrollTop = $('fil').scrollHeight;
  return d;
}

/* Message écrit par le serveur, donc destiné à l'élève. Tout le reste —
   « Load failed » d'un iPhone, « NetworkError » d'Android — ne doit jamais
   s'afficher : ce sont des mots d'ingénieur, pas des mots d'élève. */
class ErreurServeur extends Error {}

/* ---------- Envoi et réponse en direct ---------- */
async function envoyer() {
  const texte = zone.value.trim();
  if (occupe || (!texte && !photo)) return;

  occupe = true;
  afficher('eleve', texte, photo && photo.url);
  historique.push({ role: 'user', content: texte,
                    image: photo && photo.data, image_type: photo && photo.type });
  sauvegarder();

  zone.value = ''; zone.style.height = 'auto';
  photo = null; $('apercu').classList.add('cache'); majEnvoyer();

  const bulle = afficher('tuteur', '');
  bulle.corps.innerHTML = '<span class="points"><span></span><span></span><span></span></span>';
  let reponse = '', premier = true;

  try {
    const appelChat = () => fetch(API + '/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      // On n'envoie que les échanges récents : au-delà, l'élève travaille
      // sur un autre exercice et l'historique ferait grimper le coût.
      body: JSON.stringify({ eleve, niveau, code: codeAcces, seance: seanceActive,
                             messages: historique.slice(-MAX_MESSAGES) })
    });

    let r = await appelChat();
    /* Code refusé — le plus souvent parce qu'il a changé depuis la dernière
       visite. On le redemande sur place plutôt que de renvoyer l'élève à
       l'écran de départ : sa conversation reste intacte. */
    if (r.status === 403) {
      localStorage.removeItem('code_acces');
      codeAcces = '';
      const saisi = prompt("Ton code d'accès n'est plus valable.\nSaisis ton nouveau code :");
      if (!saisi || !saisi.trim()) throw new ErreurServeur("Il me faut ton code d'accès pour continuer.");
      codeAcces = saisi.trim();
      localStorage.setItem('code_acces', codeAcces);
      r = await appelChat();
      if (r.status === 403) {
        localStorage.removeItem('code_acces');
        codeAcces = '';
        throw new ErreurServeur("Ce code n'est pas reconnu. Vérifie-le auprès de la personne qui te l'a donné.");
      }
    }
    /* Limites de l'abonnement — abonnement terminé, trop d'élèves sur un
       code, plafond du jour. Le serveur explique lui-même la raison, et
       redemander le code n'y changerait rien : on la montre telle quelle. */
    if (r.status === 402 || r.status === 409 || r.status === 429) {
      const { detail } = await r.json().catch(() => ({}));
      throw new ErreurServeur(detail || "Cet abonnement a atteint sa limite.");
    }
    if (!r.ok) throw new Error('serveur');

    const lecteur = r.body.getReader(), dec = new TextDecoder();
    let tampon = '';
    while (true) {
      const { done, value } = await lecteur.read();
      if (done) break;
      tampon += dec.decode(value, { stream: true });
      const lignes = tampon.split('\n\n');
      tampon = lignes.pop();
      for (const ligne of lignes) {
        if (!ligne.startsWith('data: ')) continue;
        const ev = JSON.parse(ligne.slice(6));
        if (ev.erreur) throw new ErreurServeur(ev.erreur);
        if (ev.texte) {
          if (premier) { bulle.corps.innerHTML = ''; premier = false; }
          reponse += ev.texte;
          bulle.corps.innerHTML = formater(reponse);
          $('fil').scrollTop = $('fil').scrollHeight;
        }
      }
    }
    historique.push({ role: 'assistant', content: reponse });
    sauvegarder();
  } catch (err) {
    bulle.remove();
    // Seuls les messages écrits par le serveur sont montrés tels quels :
    // ils sont en français et disent quoi faire. Une panne de réseau donne
    // « Load failed » sur iPhone — l'élève n'a rien à faire de ça.
    afficher('erreur', err instanceof ErreurServeur
      ? err.message
      : "Ta connexion s'est interrompue. Renvoie ta question — ton travail est gardé.");
    historique.pop();
    sauvegarder();
  } finally {
    occupe = false; majEnvoyer();
  }
}

/* Mise à jour automatique : quand je corrige quelque chose, l'élève reçoit
   la nouvelle version sans avoir à recharger ni réinstaller quoi que ce soit. */
if ('serviceWorker' in navigator) {
  let rechargement = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (rechargement) return;       // garde-fou anti-boucle
    rechargement = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update();
    // On revérifie quand l'élève revient sur l'application.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) reg.update();
    });
  }).catch(() => {});
}
</script>
