# Blueprint Render : met le tuteur en ligne en un clic.
# Dans Render : New + > Blueprint > sélectionner ce dépôt.

services:
  - type: web
    name: tuteur-maths
    runtime: python
    # Plan payant (~7 $/mois) : nécessaire pour le disque ci-dessous, qui
    # conserve les conversations et les bilans entre deux redémarrages.
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config

    # Disque persistant : sans lui, le suivi de niveau des élèves serait
    # remis à zéro à chaque redémarrage du service.
    disk:
      name: donnees
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # L'application écrit conversations et bilans ici, sur le disque.
      - key: DATA_DIR
        value: /var/data

      # Votre clé Anthropic — à coller dans Render, jamais ici.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Codes d'accès, un par testeur, séparés par des virgules (fabriqués
      # par CODES.bat). SANS EUX, n'importe quel visiteur du site poserait
      # des questions à vos frais. À renseigner impérativement.
      - key: CODE_ACCES
        sync: false

      # Votre code de responsable : il donne accès à TOUS les élèves sur la
      # page parent. Sans lui, chaque code ne voit que ses propres élèves.
      # Fabriquez-le avec : CODES.bat ADMIN
      - key: CODE_ADMIN
        sync: false

      # Limites d'un abonnement. L'application garde le code enregistré dans
      # l'appareil : c'est ici que le budget est réellement protégé.
      - key: MAX_ELEVES_PAR_CODE
        value: "1"
      # Ce plafond doit rester SOUS le point mort, sinon l'élève le plus
      # travailleur est celui qui coûte le plus cher. Abaissé de 800 à 600
      # le 02/10/2026, sur les premiers vrais chiffres (191 GNF la question,
      # point mort 524). Le repère : 100 000 / 600 = 167 GNF — tant que le
      # coût moyen reste dessous, un élève qui épuise son plafond rapporte
      # encore. Le coût moyen se lit dans l'espace responsable, page
      # « Ce que ça vous coûte ».
      - key: MAX_QUESTIONS_PAR_MOIS
        value: "600"
      - key: MAX_QUESTIONS_PAR_JOUR
        value: "120"

      # Durée de mise en cache du programme entre deux questions. "5m" était
      # la valeur par défaut et coûtait cher : un élève qui cherche dix
      # minutes sur son cahier repayait l'écriture du programme (388 GNF)
      # à chaque retour. "1h" couvre une séance entière.
      - key: DUREE_CACHE
        value: "1h"

      # Prix de référence d'un abonnement mensuel, pour calculer le point
      # mort affiché au responsable. N'encaisse rien, n'affiche rien à l'élève.
      - key: PRIX_ABONNEMENT_GNF
        value: "100000"

      # Taux de change utilisé pour afficher les coûts en francs guinéens.
      - key: GNF_PAR_DOLLAR
        value: "8700"

      - key: CORS_ORIGINS
        value: "*"
